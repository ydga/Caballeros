backend:
  name: github
  repo: ydga/Caballeros
  branch: main
  auth_methods:
    - token

locale: es

media_folder: public/images
public_folder: /Caballeros/images

collections:
  - name: pages
    label: Paginas
    folder: src/content/pages
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Titulo de la pagina, name: title, widget: string }
      - { label: Encabezado, name: eyebrow, widget: string, required: false }
      - { label: Introduccion, name: lede, widget: text, required: false }
      - label: Elementos de la galeria
        name: items
        widget: list
        required: false
        fields:
          - { label: Titulo, name: title, widget: string }
          - { label: Texto, name: label, widget: string, required: false }
          - { label: Imagen, name: image, widget: image, required: false }
      - { label: Contenido, name: body, widget: markdown }
  - name: navigation
    label: Navegacion
    files:
      - name: main
        label: Navegacion principal
        file: src/content/navigation.md
        fields:
          - label: Elementos de navegacion
            name: items
            widget: list
            summary: "{{label}} — {{slug}}"
            identifier_field: label
            collapsed: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - { label: Texto, name: label, widget: string }
              - { label: Ruta, name: slug, widget: string, hint: "Use noticias para la pagina principal, o el identificador de la pagina (por ejemplo, escuela)." }
  - name: news
    label: Noticias
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titulo, name: title, widget: string }
      - { label: Fecha de publicacion, name: date, widget: datetime }
      - { label: Resumen, name: summary, widget: text, required: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Articulo, name: body, widget: markdown }
