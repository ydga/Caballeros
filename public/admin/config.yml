backend:
  name: github
  repo: ydga/Caballeros
  branch: main
  auth_methods:
    - token

media_folder: public/images
public_folder: /Caballeros/images

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Page title, name: title, widget: string }
      - { label: Eyebrow, name: eyebrow, widget: string, required: false }
      - { label: Introduction, name: lede, widget: text, required: false }
      - label: Gallery items
        name: items
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Label, name: label, widget: string, required: false }
          - { label: Image, name: image, widget: image, required: false }
      - { label: Content, name: body, widget: markdown }
  - name: navigation
    label: Navigation
    files:
      - name: main
        label: Main navigation
        file: src/content/navigation.md
        fields:
          - label: Navigation items
            name: items
            widget: list
            summary: "{{label}} — {{slug}}"
            identifier_field: label
            collapsed: false
            allow_add: true
            allow_remove: true
            allow_reorder: true
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: slug, widget: string, hint: "Use news for the home page, or the page URL slug (for example about)." }
  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Article, name: body, widget: markdown }
