backend:
  name: github
  repo: ydga/Caballeros
  branch: main
  auth_methods:
    - token

media_folder: public/images
public_folder: /Caballeros/images

collections:
  - name: pages
    label: Pages
    files:
      - name: welcome
        label: "Director's Welcome"
        file: src/content/pages/welcome.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Introduction, name: lede, widget: text, required: false }
          - { label: Message, name: body, widget: markdown }
      - name: about
        label: About the School
        file: src/content/pages/about.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Introduction, name: lede, widget: text, required: false }
          - { label: Content, name: body, widget: markdown }
      - name: gallery
        label: Gallery
        file: src/content/pages/gallery.md
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Introduction, name: lede, widget: text, required: false }
          - label: Gallery items
            name: items
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Label, name: label, widget: string, required: false }
              - { label: Image, name: image, widget: image, required: false }
  - name: news
    label: News
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Article, name: body, widget: markdown }
