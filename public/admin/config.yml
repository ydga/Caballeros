backend:
  name: github
  repo: ydga/Caballeros
  branch: main
  auth_methods:
    - token

locale: es

media_folder: public/images
public_folder: /Caballeros/images

collections:
  - name: homepage
    label: Inicio
    files:
      - name: home
        label: Contenido de la página de inicio
        file: src/content/home/index.json
        fields:
          - label: Diapositivas principales
            name: hero_slides
            widget: list
            min: 1
            fields:
              - { label: Foto de fondo, name: image, widget: image }
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: text }
              - { label: Texto del botón, name: cta_label, widget: string }
              - { label: Enlace del botón, name: cta_url, widget: string }
          - { label: Texto del botón de nuestra escuela, name: about_button_label, widget: string }
          - { label: Texto pequeño de noticias, name: news_eyebrow, widget: string }
          - { label: Título de noticias, name: news_title, widget: string }
          - { label: Enlace a todas las noticias, name: news_link_label, widget: string }
          - { label: Enlace a la galería, name: gallery_link_label, widget: string }
  - name: pages
    label: Paginas
    folder: src/content/pages
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields:
      - title
      - order
    fields:
      - { label: Titulo de la pagina, name: title, widget: string }
      - { label: Nombre en la navegacion, name: nav_label, widget: string, required: false }
      - { label: Encabezado superior, name: eyebrow, widget: string, required: false }
      - { label: Orden en la navegacion, name: order, widget: number, value_type: int, min: 1, default: 100 }
      - { label: Ocultar de la navegacion, name: hide_from_navigation, widget: boolean, default: false, required: false }
      - { label: Introduccion, name: lede, widget: text, required: false }
      - label: Elementos de la galeria
        name: items
        widget: list
        required: false
        fields:
          - { label: Titulo, name: title, widget: string }
          - { label: Texto, name: label, widget: string, required: false }
          - { label: Imagen, name: image, widget: image, required: false }
      - { label: Contenido, name: body, widget: markdown }
  - name: news
    label: Noticias
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titulo, name: title, widget: string }
      - { label: Fecha de publicacion, name: date, widget: datetime }
      - { label: Resumen, name: summary, widget: text, required: false }
      - { label: Imagen, name: image, widget: image, required: false }
      - { label: Articulo, name: body, widget: markdown }
